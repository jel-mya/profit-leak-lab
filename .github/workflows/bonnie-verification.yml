name: bonnie-verification

on:
  push:
    branches:
      - 'bonnie/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonnie-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Bonnie isolated verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Repository hygiene
        run: node scripts/check-repository.mjs

      - name: Unit and PostgreSQL tests
        run: npm test

      - name: Frontend lint
        run: npm --prefix frontend run lint

      - name: Synthetic browser acceptance
        timeout-minutes: 2
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "Headless browser unavailable; synthetic browser gate cannot pass."
            exit 1
          fi
          CHROME_BIN="$browser" npm run test:browser:synthetic

      - name: Production build
        run: npm run build

      - name: CSV worker check
        run: node scripts/check-csv-worker.mjs

      - name: Production HTTP security
        working-directory: frontend
        timeout-minutes: 2
        env:
          WRANGLER_SEND_METRICS: 'false'
          CLOUD_WORKSPACE_ENABLED: 'false'
        run: |
          node node_modules/wrangler/bin/wrangler.js dev --config dist/server/wrangler.json --ip 127.0.0.1 --port 8791 --local > "$RUNNER_TEMP/profitleaklab-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 --output /dev/null http://127.0.0.1:8791/; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              echo 'Local production Worker stopped before readiness.'
              exit 1
            fi
            sleep 1
          done
          node ../scripts/check-local-http.mjs

      - name: Record verification evidence
        if: always()
        run: |
          mkdir -p verification-evidence
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > verification-evidence/run.txt
          cp "$RUNNER_TEMP/profitleaklab-worker.log" verification-evidence/worker.log 2>/dev/null || true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonnie-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 14
